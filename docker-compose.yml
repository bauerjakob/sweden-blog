services:
  web:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 3000
      # REQUIRED: a long random string that signs session cookies. Generate one
      # with: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in a .env file next to this one}
      # Your real public URL — makes shared-link (WhatsApp/iMessage) preview
      # images absolute and correct.
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      # Optional: seeds the single admin user on first boot (when none exists).
      # After the first run you can remove these; the user persists in the volume.
      # You can also create/update the admin later:
      #   docker compose exec web node server/seed-admin.mjs <user> <pass>
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${PORT:-8080}:3000"
    volumes:
      # Persists the SQLite database and uploaded photos across restarts.
      - sweden_data:/app/data
    restart: unless-stopped

volumes:
  sweden_data:
